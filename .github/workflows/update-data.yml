name: Actualizar datos

# A diario: regenera los datos de Copernicus EMS (activación EMSR916, terremoto
# de Colombia del 10-ago-2026). Si algo cambia, hace commit; la integración Git
# de Vercel redesplega sola.
#
# Sin dependencias npm y sin ninguna API de pago: los scripts usan solo builtins
# de Node contra el backend público de Copernicus.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC cada día
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerar datos Copernicus (EMSR916)
        run: npm run fetch:all

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos: actualización automática ($(date -u +%F))"
            git push
            echo "Datos actualizados y enviados; Vercel redesplegará."
          fi
