name: Actualizar datos

# A diario: regenera las dos capas de datos del terremoto de Colombia
# (10-ago-2026, EMSR916). Si algo cambia, hace commit; la integración Git de
# Vercel redesplega sola.
#
#   1. Copernicus EMS  → daño observado, cuando la activación entregue productos.
#   2. USGS × DANE     → sacudida modelada cruzada con déficit habitacional.
#      Importante: las URLs de producto del USGS van versionadas y se resuelven
#      siempre desde el feed de detalle, así que el ShakeMap se refresca solo
#      cuando el USGS revisa el evento (hoy sigue en 'automatic').
#
# Sin dependencias npm y sin ninguna API de pago: solo builtins de Node contra
# backends públicos.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC cada día
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerar datos (Copernicus + USGS×DANE)
        run: npm run fetch:all

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos: actualización automática ($(date -u +%F))"
            git push
            echo "Datos actualizados y enviados; Vercel redesplegará."
          fi
